<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Looper</title>
<style>
  body { background:#141414; color:#ddd; font:13px/1.5 ui-monospace,Consolas,monospace; margin:16px; }
  #top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  input,select,button { background:#1e1e1e; color:#ddd; border:1px solid #444; font:inherit; padding:4px 6px; }
  #url { width:330px; }
  input[type=number] { width:80px; }
  button { cursor:pointer; padding:4px 12px; }
  #stage { position:relative; width:480px; height:270px; background:#000; }
  .slot { position:absolute; inset:0; }
  .slot iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #bar { position:relative; width:480px; height:34px; margin-top:12px; background:#1e1e1e;
         border:1px solid #444; touch-action:none; user-select:none; }
  #region { position:absolute; top:0; bottom:0; background:#2a4a3a; }
  .handle { position:absolute; top:0; bottom:0; width:9px; margin-left:-4px; background:#4c8;
            cursor:ew-resize; }
  #head { position:absolute; top:0; bottom:0; width:3px; margin-left:-1px; background:#fff; cursor:ew-resize; }
  #ghost { position:absolute; top:0; bottom:0; width:3px; margin-left:-1px; background:#ff0; display:none; }
  #time { margin-top:6px; color:#888; }
</style>
</head>
<body>

<div id="top">
  <input type="text" id="url" value="https://www.youtube.com/watch?v=Z_mzYS-ET8o" placeholder="YouTube URL">
  <input type="number" id="ls" value="18.1" step="0.001">
  <input type="number" id="le" value="25.7" step="0.001">
  <button id="back">&laquo;</button>
  <button id="fwd">&raquo;</button>
  <select id="rate"><option>0.5</option><option>0.75</option><option selected>1</option></select>
</div>

<div id="stage">
  <div class="slot" id="sA"><div id="pA"></div></div>
  <div class="slot" id="sB"><div id="pB"></div></div>
</div>

<div id="bar">
  <div id="region"></div>
  <div class="handle" id="hStart"></div>
  <div class="handle" id="hEnd"></div>
  <div id="head"></div>
  <div id="ghost"></div>
</div>
<div id="time"></div>

<script>
var XF=250, POLL=20, STEPS=10, MAXCORR=1.25, JUMP_SETTLE=250, ARM_MIN=1.5;

var $=function(s){ return document.getElementById(s); };
var P={A:null,B:null}, live='A', armed='B';
var phase='idle';                       // idle | starting | running | fading
var cfg={id:'',ls:18.1,le:25.7,rate:1};
var T={A:trk(),B:trk()};
var poller=null, cur={}, jumpReq=null, vidDur=0, apiReady=false, loadT=null, paused=false, nudge=0;

function trk(){ return {raw:-1,rawWall:0,st:-99,play:false,ready:false,readyWall:0,seek:null,settle:300,rate:1,stall:0,trim:0,tick:0}; }
function now(){ return performance.now(); }

// interpolate between polls; cap so a stall cannot run away
function proj(k){
  var t=T[k];
  if(t.raw<0) return 0;
  var cap=Math.max(0.5,2.5*(t.tick||16)/1000);   // never freeze mid-report-interval
  var d=(now()-t.rawWall)/1000*(t.rate||cfg.rate);
  return t.raw+(d>cap?cap:d);
}

function parseId(s){
  s=(s||'').trim();
  var m=s.match(/[?&]v=([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=s.match(/\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  return /^[A-Za-z0-9_-]{6,}$/.test(s)?s:'';
}

// ---------- URL parameters ----------
// ?v=<id|url>&ls=<sec>&le=<sec> seeds the fields; every later change writes back, so the
// address bar is always a shareable link to the current loop.
function readParams(){
  var q=new URLSearchParams(location.search);
  var id=parseId(q.get('v')||q.get('url')||'');
  if(id) $('url').value='https://www.youtube.com/watch?v='+id;
  var a=parseFloat(q.get('ls')), b=parseFloat(q.get('le'));
  if(!isNaN(a)&&!isNaN(b)&&a>=0&&b>a){ cfg.ls=a; cfg.le=b; }
  else if(!isNaN(a)&&a>=0&&a<cfg.le) cfg.ls=a;
  else if(!isNaN(b)&&b>cfg.ls) cfg.le=b;
  $('ls').value=+cfg.ls.toFixed(3);
  $('le').value=+cfg.le.toFixed(3);
}

function pushParams(){
  var q=new URLSearchParams(location.search);
  var id=parseId($('url').value);
  q.delete('url');
  if(id) q.set('v',id); else q.delete('v');
  q.set('ls',+cfg.ls.toFixed(3));
  q.set('le',+cfg.le.toFixed(3));
  // file:// forbids replaceState in some browsers; the page must not die over a URL
  try{ history.replaceState(null,'','?'+q.toString()+location.hash); }catch(e){}
}

readParams();

// ---------- load ----------
var tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=function(){ apiReady=true; tryLoad(); };

$('url').addEventListener('input',function(){
  clearTimeout(loadT);
  loadT=setTimeout(tryLoad,700);
});

function tryLoad(){
  if(!apiReady) return;
  var id=parseId($('url').value);
  if(!id || id===cfg.id) return;
  cfg.id=id; vidDur=0; pushParams();
  if(!P.A) create(); else { ['A','B'].forEach(function(k){ P[k].loadVideoById(id); }); start(); }
}

function create(){
  var ready=0;
  ['A','B'].forEach(function(k){
    P[k]=new YT.Player('p'+k,{
      width:'480', height:'270', videoId:cfg.id,
      playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,playsinline:1,fs:0},
      events:{ onReady:function(){ if(++ready===2) start(); } }
    });
  });
}

function start(){
  phase='starting'; paused=false; nudge=now();
  T.A=trk(); T.B=trk();
  live='A'; armed='B'; jumpReq=null; cur={};
  ['A','B'].forEach(function(k){
    try{ P[k].mute(); P[k].setVolume(0); P[k].setPlaybackRate(cfg.rate); P[k].playVideo(); }catch(e){}
  });
  if(!poller){
    poller=setInterval(poll,POLL);
    // setInterval is coalesced when the main thread is busy (two video decoders on a
    // phone will do it). rAF runs at display rate while visible; the interval remains
    // as the backstop for when the tab is hidden.
    (function raf(){ requestAnimationFrame(function(){ poll(); raf(); }); })();
  }
}

// autoplay fallback: only while still trying to start, so it cannot fight a deliberate pause
document.addEventListener('pointerdown',function(){
  if(phase!=='starting') return;
  ['A','B'].forEach(function(k){ try{ P[k].unMute(); P[k].playVideo(); }catch(e){} });
});

// ---------- seeking ----------
function seek(k,target){
  T[k].ready=false; T[k].readyWall=0;
  T[k].seek={target:target,wall:now()};
  try{ P[k].seekTo(target,true); P[k].setVolume(0); }catch(e){}
}

// ---------- poll ----------
function poll(){
  var w=now();
  ['A','B'].forEach(function(k){
    var p=P[k]; if(!p||!p.getCurrentTime) return;
    var t,s;
    try{ t=p.getCurrentTime(); s=p.getPlayerState(); }catch(e){ return; }
    T[k].st=s;
    if(s===1) T[k].play=true;
    if(t!==T[k].raw){
      // how often this player reports a NEW currentTime. Desktop is ~per frame; mobile can
      // be hundreds of ms. Everything downstream must be judged against this, not a constant.
      if(T[k].rawWall && !T[k].seek){
        var gap=w-T[k].rawWall;
        if(gap>0 && gap<2000) T[k].tick = T[k].tick ? T[k].tick*0.8+gap*0.2 : gap;
      }
      if(T[k].seek && Math.abs(t-T[k].seek.target)<2.5){
        T[k].settle=w-T[k].seek.wall;      // measured, feeds the next seek's aim
        T[k].seek=null; T[k].ready=true; T[k].readyWall=w;
      }
      T[k].raw=t; T[k].rawWall=w; T[k].stall=0;
    }
    T[k].stall=w-T[k].rawWall;    // wall-based: poll cadence is not fixed on mobile
    if(T[k].seek && w-T[k].seek.wall>3000){ T[k].seek=null; T[k].ready=true; T[k].readyWall=w; }
  });

  if(!vidDur){ try{ var d=P[live].getDuration(); if(d>1) vidDur=d; }catch(e){} }
  try{ T.A.rate=P.A.getPlaybackRate(); T.B.rate=P.B.getPlaybackRate(); }catch(e){}

  reconcile();

  if(phase==='starting') tryRun();
  else if(phase==='running' && !paused) runLoop();
}

// Clicking the embed toggles YouTube's own play/pause on ONE player. The engine assumes it
// is the only thing driving playback, so mirror any state it did not initiate.
function reconcile(){
  if(phase!=='running') return;
  var lv=T[live].st, av=T[armed].st;
  if(!paused && lv===2){                       // paused from the embed
    paused=true;
    try{ P[armed].pauseVideo(); }catch(e){}
  } else if(paused && lv===1){                 // resumed from the embed
    paused=false;
    try{ P[armed].playVideo(); }catch(e){}
    cur.rearmed=false;                         // re-establish phase after the gap
  } else if(!paused && av===2){                // only the armed one stopped
    try{ P[armed].playVideo(); }catch(e){}
    cur.rearmed=false;
  }
}

// "Not advancing" only means something relative to how often this player reports at all.
// A fixed 120 ms threshold marks a healthy mobile player as stalled for most of every
// update cycle, so the splice can only fire in the brief window after each report and
// lands late by up to one interval.
function stallLimit(k){ return Math.max(120,2.5*(T[k].tick||16)); }

function tryRun(){
  if(!(T.A.play && T.B.play)){
    // Autoplay may have been blocked, in which case the user starts playback by clicking
    // the embed -- but they can only see the live player, so the other one never starts
    // and the loop never begins. Nudge whichever is not playing; it is muted, and muted
    // autoplay is permitted.
    if(now()-nudge>700){
      nudge=now();
      ['A','B'].forEach(function(k){
        if(T[k].st!==1){ try{ P[k].mute(); P[k].playVideo(); }catch(e){} }
      });
    }
    return;
  }
  try{
    P[live].unMute();  P[live].setVolume(100);
    P[armed].unMute(); P[armed].setVolume(0);
    P[live].seekTo(cfg.ls,true);
  }catch(e){}
  T[live].ready=true; T[live].readyWall=now();
  seek(armed,Math.max(0,cfg.ls-ARM_MIN));
  cur={rearmed:false};
  phase='running';
}

function runLoop(){
  var L=proj(live), A=proj(armed), dur=cfg.le-cfg.ls, xs=XF/1000;
  var settledArmed = T[armed].ready && T[armed].st===1 && T[armed].stall<=stallLimit(armed) &&
                     T[armed].readyWall && now()-T[armed].readyWall>JUMP_SETTLE;

  // a jump owns the armed player until it fires
  if(jumpReq && !jumpReq.deferred){
    if(settledArmed){ jumpReq=null; fade(); }
    return;
  }

  // A seeking player's playhead freezes while live keeps moving, so aim at where live WILL
  // be when the seek lands, and give the lead room for that settle plus the ready guard.
  var ps=T[armed].settle/1000;
  var lead=Math.max(ARM_MIN,ps+0.8);
  if(lead>dur-0.3) lead=Math.max(0.3,dur-0.3);

  if(!cur.rearmed && L>=cfg.le-lead){
    var tgt=L+ps*(T[live].rate||cfg.rate)-dur+T[armed].trim;
    if(tgt>=0.3){ cur.rearmed=true; seek(armed,tgt); }
  }

  var corr=(L-A)-dur;
  // Tail overlap. Triggering at loopEnd-xfade would put the incoming player at
  // loopStart-xfade when the fade BEGINS, so a whole crossfade of pre-loopStart material
  // fades in -- audibly "seeking too early" once the fade is long. Trigger at loopEnd
  // instead: the incoming starts exactly on loopStart and the outgoing runs past loopEnd
  // while fading out, which is its natural continuation and is masked by the fade.
  var trigger=cfg.le+Math.max(-MAXCORR,Math.min(MAXCORR,corr));

  // a correction past the clamp means the armed player is in the wrong place entirely;
  // fading anyway would splice to a wrong position
  if(L>=trigger && cur.rearmed && settledArmed && Math.abs(corr)<=MAXCORR){ cur.corrAtFade=corr; fade(); return; }

  // Recovery must fire ONCE and then wait: re-seeking every poll resets the armed player's
  // settle clock, so it never becomes usable and playback runs away forever.
  if(L>=cfg.le+1.0 && !T[armed].seek && (!cur.recov || now()-cur.recov>1200)){
    cur.recov=now();
    var et=L+ps*(T[live].rate||cfg.rate)-dur;
    if(et>=0.3) seek(armed,et);
  }

  // last resort: if the armed player stays unusable, fold live back into the loop itself.
  // Audible, but the loop is never lost.
  if(L>cfg.le+3.0 && (!cur.hard || now()-cur.hard>3000)){
    cur.hard=now();
    try{ P[live].seekTo(cfg.ls+wrapIntoLoop(L),true); }catch(e){}
    cur.rearmed=false;
  }
}

// ---------- crossfade ----------
function fade(){
  phase='fading';
  var from=live, to=armed, dt=XF/STEPS;
  for(var i=1;i<=STEPS;i++){
    (function(i){
      setTimeout(function(){
        var f=i/STEPS;
        try{
          P[from].setVolume(Math.round(100*Math.sqrt(1-f)));   // equal power
          P[to].setVolume(Math.round(100*Math.sqrt(f)));
        }catch(e){}
        if(i===STEPS) done(from,to);
      },dt*i);
    })(i);
  }
}

function done(from,to){
  try{ P[from].setVolume(0); P[to].setVolume(100); }catch(e){}
  // Feed the residual back into the seek target for the player we just seeked. corr is
  // (actualSettle - predictedSettle)*rate - landingBias; rather than model either term,
  // integrate the observed error so it converges whatever the cause. Matters on mobile,
  // where keyframe snapping and main-thread jank make both terms large.
  if(cur.corrAtFade!==undefined){
    var tr=T[to].trim+0.5*cur.corrAtFade;
    T[to].trim=Math.max(-2,Math.min(2,tr));
  }
  live=to; armed=from;
  T[armed].ready=false;
  cur={rearmed:false};
  phase='running';
  if(jumpReq && jumpReq.deferred){ var w=jumpReq.want; jumpReq=null; armJump(w); }
}

// ---------- jumping: window and playhead move together, by whole loops ----------
// Where we are within the loop. If playback has escaped past loopEnd this folds it back
// in, so a jump re-enters the loop rather than carrying the escape along unchanged.
function wrapIntoLoop(L){
  var dur=cfg.le-cfg.ls;
  if(L<cfg.ls) return 0;                       // behind the window: land on its start
  return ((L-cfg.ls)%dur+dur)%dur;
}

function jumpBy(n){
  if(!n) return;
  var dur=cfg.le-cfg.ls;
  var nls=cfg.ls+n*dur, nle=cfg.le+n*dur;
  if(nls<0 || (vidDur && nle>vidDur)) return;
  var L=paused?T[live].raw:proj(live);
  var want=(nls+wrapIntoLoop(L))-L;            // n*dur exactly when already inside the loop
  cfg.ls=nls; cfg.le=nle; syncInputs();
  if(paused){
    var t=L+want;
    if(t>=0){ try{ P[live].seekTo(t,true); }catch(e){} }
    cur.rearmed=false;
    return;
  }
  if(phase==='running'||phase==='fading') armJump(want);
}

// (armed - live) is frozen the moment the seek lands, so bake the offset into the target
// and fade as soon as the armed player is genuinely playing. No lead, no position trigger.
function armJump(want){
  if(phase==='fading'){
    jumpReq={deferred:true,want:(jumpReq?jumpReq.want:0)+want};
    return;
  }
  var w=(jumpReq && !jumpReq.deferred ? jumpReq.want : 0)+want;   // repeat presses accumulate
  var ps=T[armed].settle/1000, r=T[live].rate||cfg.rate;
  var tgt=proj(live)+ps*r+w+T[armed].trim;
  if(tgt<0.3 || (vidDur && tgt>vidDur-1)){ jumpReq=null; return; }
  jumpReq={want:w};
  cur.rearmed=true;
  seek(armed,tgt);
}

$('fwd').onclick=function(){ jumpBy(1); };
$('back').onclick=function(){ jumpBy(-1); };

// ---------- play / pause ----------
// Both players pause and resume together so their offset survives. Any drift across the
// resume is absorbed by forcing a re-arm, and the misplacement guard blocks a bad splice
// in the meantime.
function togglePlay(){
  if(phase!=='running' && phase!=='fading') return;
  paused=!paused;
  ['A','B'].forEach(function(k){
    try{ paused ? P[k].pauseVideo() : P[k].playVideo(); }catch(e){}
  });
  if(!paused) cur.rearmed=false;
}

document.addEventListener('keydown',function(e){
  var t=e.target.tagName;
  if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA') return;   // let the fields have their keys
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); jumpBy(1); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); jumpBy(-1); }
});

// ---------- bounds + rate ----------
function syncInputs(){ $('ls').value=+cfg.ls.toFixed(3); $('le').value=+cfg.le.toFixed(3); pushParams(); }
function boundsChanged(){ cur.rearmed=false; pushParams(); }

$('ls').onchange=function(){
  var v=parseFloat(this.value);
  if(isNaN(v)||v<0||v>=cfg.le) return syncInputs();
  cfg.ls=v; boundsChanged();
};
$('le').onchange=function(){
  var v=parseFloat(this.value);
  if(isNaN(v)||v<=cfg.ls) return syncInputs();
  cfg.le=v; boundsChanged();
};
$('rate').onchange=function(){
  cfg.rate=parseFloat(this.value);
  ['A','B'].forEach(function(k){ try{ P[k].setPlaybackRate(cfg.rate); }catch(e){} });
};

// ---------- seek bar ----------
var bar=$('bar'), drag=null;

function xToTime(e){
  var r=bar.getBoundingClientRect();
  var f=(e.clientX-r.left)/r.width;
  return Math.max(0,Math.min(1,f))*vidDur;
}

bar.addEventListener('pointerdown',function(e){
  if(!vidDur) return;
  var id=e.target.id;
  if(id!=='hStart'&&id!=='hEnd'&&id!=='head') return;
  drag={id:id, step:cfg.le-cfg.ls, t0:xToTime(e), n:0,
        base: id==='hStart'?cfg.ls : id==='hEnd'?cfg.le : proj(live)};
  bar.setPointerCapture(e.pointerId);
  e.preventDefault();
});

bar.addEventListener('pointermove',function(e){
  if(!drag) return;
  drag.n=Math.round((xToTime(e)-drag.t0)/drag.step);   // snap to whole loop durations
  var g=$('ghost');
  g.style.display='block';
  g.style.left=(100*(drag.base+drag.n*drag.step)/vidDur)+'%';
});

bar.addEventListener('pointerup',function(e){
  if(!drag) return;
  var d=drag; drag=null;
  $('ghost').style.display='none';
  if(!d.n) return;
  var v=d.base+d.n*d.step;
  if(d.id==='head'){ jumpBy(d.n); }
  else if(d.id==='hStart'){
    if(v>=0 && v<=cfg.le-d.step){ cfg.ls=v; syncInputs(); boundsChanged(); }
  } else {
    if(v>=cfg.ls+d.step && (!vidDur||v<=vidDur)){ cfg.le=v; syncInputs(); boundsChanged(); }
  }
});

// ---------- render ----------
function fmt(t){ var m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(2); }

function render(){
  $('sA').style.zIndex = live==='A'?2:1;
  $('sB').style.zIndex = live==='B'?2:1;
  if(vidDur){
    var L=proj(live);
    var a=100*cfg.ls/vidDur, b=100*cfg.le/vidDur;
    $('region').style.left=a+'%';
    $('region').style.width=(b-a)+'%';
    $('hStart').style.left=a+'%';
    $('hEnd').style.left=b+'%';
    $('head').style.left=(100*L/vidDur)+'%';
    $('time').textContent=fmt(L)+'   loop '+fmt(cfg.ls)+' - '+fmt(cfg.le)+'   ('+(cfg.le-cfg.ls).toFixed(2)+'s)'+(paused?'   PAUSED':'');
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
